# REPLAY DO ORACULO no harness quente: roda a celula vencedora da matriz (t*)
# para cada query, 1 iteracao, k=3 em sessao. Validacao do harness: se q03 der
# ~21-25s (matriz: 20.7s) o overhead frio de ~45s/run foi eliminado e o regret
# volta a medir o LLM; se continuar ~70s, o harness ainda tem custo fixo.
# Tambem mede o offset harness-vs-matriz por query para o paper.
name: cluster-oracle-replay-sf100
mode: optimize
backend: spark_k8s
arm: fixed
level: L0
provider: oracle-replay
datasets: [sf100]
queries: [q03, q23, q50]
tries: 3
max_iters: 1
patience: 1
configs:
  q03: {executor_cores: 2,  executor_memory_gb: 7,  executor_instances: 20,
        driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64,
        aqe_enabled: true, broadcast_threshold_mb: 10}
  q23: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 6,
        driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64,
        aqe_enabled: true, broadcast_threshold_mb: 10}
  q50: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 6,
        driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64,
        aqe_enabled: true, broadcast_threshold_mb: 10}
