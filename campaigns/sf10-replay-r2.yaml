# Replay do oraculo em sf10: celula rank 2 da matriz por query, no harness
# quente (regua t*_harness deste SF = min dos ranks). Gerado por scripts/gen_sf_campaigns.py.
name: sf10-replay-r2
mode: optimize
backend: spark_k8s
arm: fixed
level: L0
provider: oracle-replay
datasets: [sf10]
queries: [q03, q23, q50]
tries: 3
max_iters: 1
patience: 1
baseline: false
configs:
  q03: {executor_cores: 24, executor_memory_gb: 96, executor_instances: 2, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=6.1s
  q23: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 2, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=21.1s
  q50: {executor_cores: 24, executor_memory_gb: 96, executor_instances: 2, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=11.5s
