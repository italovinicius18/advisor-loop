# Replay do oraculo em sf50: celula rank 3 da matriz por query, no harness
# quente (regua t*_harness deste SF = min dos ranks). Gerado por scripts/gen_sf_campaigns.py.
name: sf50-replay-r3
mode: optimize
backend: spark_k8s
arm: fixed
level: L0
provider: oracle-replay
datasets: [sf50]
queries: [q03, q23, q50]
tries: 3
max_iters: 1
patience: 1
baseline: false
configs:
  q03: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 4, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=14.6s
  q23: {executor_cores: 4, executor_memory_gb: 14, executor_instances: 12, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=59.3s
  q50: {executor_cores: 8, executor_memory_gb: 28, executor_instances: 4, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=31.6s
