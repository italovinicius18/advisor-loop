# Regua (queries representativas): celula rank 2 da matriz em sf500. Gerado por scripts/gen_rep_campaigns.py.
name: sf500-rep-replay-r2
mode: optimize
backend: spark_k8s
arm: fixed
level: L0
provider: oracle-replay
datasets: [sf500]
queries: [q19, q71, q94, q66, q05, q02]
tries: 3
max_iters: 1
patience: 1
baseline: false
configs:
  q19: {executor_cores: 4, executor_memory_gb: 14, executor_instances: 10, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=85.0s
  q71: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 6, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=69.1s
  q94: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 4, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=30.8s
  q66: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 6, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=34.4s
  q05: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 6, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=89.2s
  q02: {executor_cores: 4, executor_memory_gb: 14, executor_instances: 10, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=45.2s
