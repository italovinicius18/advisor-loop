# Replay do oraculo em sf500: celula rank 3 da matriz por query, no harness
# quente (regua t*_harness deste SF = min dos ranks). Gerado por scripts/gen_sf_campaigns.py.
name: sf500-replay-r3
mode: optimize
backend: spark_k8s
arm: fixed
level: L0
provider: oracle-replay
datasets: [sf500]
queries: [q03, q23, q50]
tries: 3
max_iters: 1
patience: 1
baseline: false
configs:
  q03: {executor_cores: 8, executor_memory_gb: 28, executor_instances: 6, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=75.6s
  q23: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 4, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=593.5s
  q50: {executor_cores: 8, executor_memory_gb: 28, executor_instances: 6, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=212.8s
