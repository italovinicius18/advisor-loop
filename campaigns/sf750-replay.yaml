# Replay do oraculo em sf750: celula vencedora da matriz por query, no harness
# quente (regua t*_harness deste SF). Gerado por scripts/gen_sf_campaigns.py.
name: sf750-replay
mode: optimize
backend: spark_k8s
arm: fixed
level: L0
provider: oracle-replay
datasets: [sf750]
queries: [q03, q23, q50]
tries: 3
max_iters: 1
patience: 1
# SF>=750: knobs pinados = os da matriz neste SF (patch v2) e baseline =
# menor celula 'large' (12c x 2w x 48g); o default Spark nao roda aqui.
pinned: {driver_memory_gb: 16, shuffle_partitions: 2000, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}
baseline_config: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 2, driver_memory_gb: 16, shuffle_partitions: 2000, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}
configs:
  q03: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 4, driver_memory_gb: 16, shuffle_partitions: 2000, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=120.1s
  q23: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 6, driver_memory_gb: 16, shuffle_partitions: 2000, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=836.9s
  q50: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 6, driver_memory_gb: 16, shuffle_partitions: 2000, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=303.6s
