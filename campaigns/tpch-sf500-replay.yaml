# Replay do oraculo em tpch-sf500: celula rank 1 da matriz por query, no harness
# quente (regua t*_harness deste SF = min dos ranks). Gerado por scripts/gen_sf_campaigns.py.
name: tpch-sf500-replay
mode: optimize
backend: spark_k8s
arm: fixed
level: L0
provider: oracle-replay
datasets: [tpch-sf500]
queries: [q01, q09, q18]
tries: 3
max_iters: 1
patience: 1
baseline: false
configs:
  q01: {executor_cores: 24, executor_memory_gb: 96, executor_instances: 2, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=25.2s
  q09: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 6, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=477.0s
  q18: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 4, driver_memory_gb: 8, shuffle_partitions: 200, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}   # t*=422.8s
