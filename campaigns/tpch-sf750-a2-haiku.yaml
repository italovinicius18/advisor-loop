# Hibrido v4.1 (envelope de escala), ancora llm, em tpch-sf750. Gerado por scripts/gen_sf_campaigns.py.
name: tpch-sf750-a2-haiku
mode: optimize
backend: spark_k8s
arm: hybrid
llm_every: 3
knobs: matrix3
level: L0
anchor: llm
provider: anthropic/claude-haiku-4.5
datasets: [tpch-sf750]
queries: [q01, q09, q18]
tries: 3
max_iters: 8
patience: 3
# SF>=750: knobs pinados = os da matriz neste SF (patch v2) e baseline =
# menor celula 'large' (12c x 2w x 48g); o default Spark nao roda aqui.
pinned: {driver_memory_gb: 16, shuffle_partitions: 2000, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}
baseline_config: {executor_cores: 12, executor_memory_gb: 48, executor_instances: 2, driver_memory_gb: 16, shuffle_partitions: 2000, advisory_partition_mb: 64, aqe_enabled: true, broadcast_threshold_mb: 10}
