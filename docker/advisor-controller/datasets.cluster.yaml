# TPC-H (exp06): mesmo SF, Silver em silver/sf<N>/tpch/delta/parquet; o nome
# 'tpch-sf<N>' seleciona tabelas e queries-tpch/ (advisor_loop/benchmarks.py).
# So sf500/sf750 tem Silver TPC-H no MinIO (sf100/250 foram removidos da Silver).
tpch-sf500:
  customer: s3://silver/sf500/tpch/delta/parquet/customer
  lineitem: s3://silver/sf500/tpch/delta/parquet/lineitem
  nation: s3://silver/sf500/tpch/delta/parquet/nation
  orders: s3://silver/sf500/tpch/delta/parquet/orders
  part: s3://silver/sf500/tpch/delta/parquet/part
  partsupp: s3://silver/sf500/tpch/delta/parquet/partsupp
  region: s3://silver/sf500/tpch/delta/parquet/region
  supplier: s3://silver/sf500/tpch/delta/parquet/supplier
tpch-sf750:
  customer: s3://silver/sf750/tpch/delta/parquet/customer
  lineitem: s3://silver/sf750/tpch/delta/parquet/lineitem
  nation: s3://silver/sf750/tpch/delta/parquet/nation
  orders: s3://silver/sf750/tpch/delta/parquet/orders
  part: s3://silver/sf750/tpch/delta/parquet/part
  partsupp: s3://silver/sf750/tpch/delta/parquet/partsupp
  region: s3://silver/sf750/tpch/delta/parquet/region
  supplier: s3://silver/sf750/tpch/delta/parquet/supplier
spark:
  ssh_cmd: [bash, -c]        # exec local no pod (sem SSH); kubectl usa a SA in-cluster
  # r10: tries em sessao + warm-up (harness quente); r9: driver coleta cpu/run time, tasks/stages, skew e resumo do plano fisico
  # (sinais de utilizacao + perfil da query na iteracao 0).
  # r12: driver resolve 'tpch-sf<N>' (Silver tpch/ + queries-tpch/), TPC-DS inalterado.
  # r13: + SQL das queries representativas (q02, q05, q19, q66, q71, q94).
  image: ghcr.io/italovinicius18/spark-advisor:4.2.0-delta-r13
  # Multi-no via nodeAffinity (nao node_selector de no unico): fixar ids-pb (24c)
  # starvava executores e impedia o otimo de q23/q50 (72c/288Gi, exige >= 2 nos)
  # -> regret confundido com o cap do no. O SA namespace-scoped nao pode rotular
  # nodes, entao a unica via e podTemplateFile com affinity In [...] assado na
  # imagem. pod_template_file mira driver+executors; node_affinity_hostnames
  # espelha a MESMA lista p/ o pod launcher (que nao le o arquivo assado).
  # Pool de egress = nos que puxam a imagem do GHCR e roteiam o MinIO.
  pod_template_file: /opt/advisor/pod-template-egress.yaml
  node_affinity_hostnames: [ids-es, ids-rn, ids-pb, ids-go]   # ids-go = MinIO (colocation)
  # Teto de wall clock POR SUBMIT (o submitter multiplica por tries+1 com tries em
  # sessao): 3000s x 4 = 200 min. Necessario para a baseline default (8 cores)
  # de q23 em sf500 (~25 min/execucao x 4). Em sf100 nunca chega perto.
  max_wall_clock_s: 3000
