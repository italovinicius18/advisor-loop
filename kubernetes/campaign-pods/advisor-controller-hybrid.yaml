# Braco hibrido (k=3, sonnet, knobs=matrix3, driver r9). Par exato do matrix3.
apiVersion: v1
kind: Pod
metadata:
  name: advisor-controller-hybrid
  namespace: italo-unb
  labels:
    app: advisor-controller
    campaign: cluster-smoke-sf100-hybrid-sonnet
spec:
  serviceAccountName: ns-admin
  restartPolicy: Never
  imagePullSecrets:
    - name: ghcr-pull
  nodeSelector:
    kubernetes.io/hostname: ids-pb
  containers:
    - name: controller
      image: ghcr.io/italovinicius18/advisor-controller:sf100-r9
      imagePullPolicy: Always
      env:
        - name: CAMPAIGN
          value: campaigns/cluster-smoke-sf100-hybrid-sonnet.yaml
        - name: RESULT_PREFIX
          value: smoke-sf100-hybrid-sonnet
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: advisor-secrets
              key: OPENROUTER_API_KEY
      resources:
        requests: {memory: "512Mi", cpu: "250m"}
        limits: {memory: "1Gi", cpu: "500m"}
