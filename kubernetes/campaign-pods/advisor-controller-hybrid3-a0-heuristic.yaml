# hybrid3: hibrido v3 (consolidacao) -- ver campaigns/cluster-smoke-sf100-hybrid3-a0-heuristic.yaml
apiVersion: v1
kind: Pod
metadata:
  name: advisor-controller-hybrid3-a0-heuristic
  namespace: italo-unb
  labels:
    app: advisor-controller
    campaign: cluster-smoke-sf100-hybrid3-a0-heuristic
spec:
  serviceAccountName: ns-admin
  restartPolicy: Never
  imagePullSecrets:
    - name: ghcr-pull
  nodeSelector:
    kubernetes.io/hostname: ids-pb
  containers:
    - name: controller
      image: ghcr.io/italovinicius18/advisor-controller:sf100-r13
      imagePullPolicy: Always
      env:
        - name: CAMPAIGN
          value: campaigns/cluster-smoke-sf100-hybrid3-a0-heuristic.yaml
        - name: RESULT_PREFIX
          value: smoke-sf100-hybrid3-a0-heuristic
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: advisor-secrets
              key: OPENROUTER_API_KEY
      resources:
        requests: {memory: "512Mi", cpu: "250m"}
        limits: {memory: "1Gi", cpu: "500m"}
