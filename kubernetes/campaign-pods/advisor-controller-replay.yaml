# Replay do oraculo no harness quente (validacao do harness; ~15-20 min).
apiVersion: v1
kind: Pod
metadata:
  name: advisor-controller-replay
  namespace: italo-unb
  labels:
    app: advisor-controller
    campaign: cluster-oracle-replay-sf100
spec:
  serviceAccountName: ns-admin
  restartPolicy: Never
  imagePullSecrets:
    - name: ghcr-pull
  nodeSelector:
    kubernetes.io/hostname: ids-pb
  containers:
    - name: controller
      image: ghcr.io/italovinicius18/advisor-controller:sf100-r11
      imagePullPolicy: Always
      env:
        - name: CAMPAIGN
          value: campaigns/cluster-oracle-replay-sf100.yaml
        - name: RESULT_PREFIX
          value: oracle-replay-sf100
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: advisor-secrets
              key: OPENROUTER_API_KEY
      resources:
        requests: {memory: "512Mi", cpu: "250m"}
        limits: {memory: "1Gi", cpu: "500m"}
