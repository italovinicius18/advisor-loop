# sf10-replay (multi-SF; gerado por scripts/gen_sf_campaigns.py)
apiVersion: v1
kind: Pod
metadata:
  name: advisor-controller-sf10-replay
  namespace: italo-unb
  labels:
    app: advisor-controller
    campaign: sf10-replay
spec:
  serviceAccountName: ns-admin
  restartPolicy: Never
  imagePullSecrets:
    - name: ghcr-pull
  nodeSelector:
    kubernetes.io/hostname: ids-pb
  containers:
    - name: controller
      image: ghcr.io/italovinicius18/advisor-controller:sf100-r15
      imagePullPolicy: Always
      env:
        - name: CAMPAIGN
          value: campaigns/sf10-replay.yaml
        - name: RESULT_PREFIX
          value: sf10-replay
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: advisor-secrets
              key: OPENROUTER_API_KEY
      resources:
        requests: {memory: "512Mi", cpu: "250m"}
        limits: {memory: "1Gi", cpu: "500m"}
