# sf500-rep-a2-haiku (queries representativas; gerado por scripts/gen_rep_campaigns.py)
apiVersion: v1
kind: Pod
metadata:
  name: advisor-controller-sf500-rep-a2-haiku
  namespace: italo-unb
  labels:
    app: advisor-controller
    campaign: sf500-rep-a2-haiku
spec:
  serviceAccountName: ns-admin
  restartPolicy: Never
  imagePullSecrets:
    - name: ghcr-pull
  nodeSelector:
    kubernetes.io/hostname: ids-pb
  containers:
    - name: controller
      image: ghcr.io/italovinicius18/advisor-controller:sf100-r27
      imagePullPolicy: Always
      env:
        - name: CAMPAIGN
          value: campaigns/sf500-rep-a2-haiku.yaml
        - name: RESULT_PREFIX
          value: sf500-rep-a2-haiku
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: advisor-secrets
              key: OPENROUTER_API_KEY
      resources:
        requests: {memory: "512Mi", cpu: "250m"}
        limits: {memory: "1Gi", cpu: "500m"}
