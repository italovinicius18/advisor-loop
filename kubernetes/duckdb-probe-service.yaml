# =============================================================================
# duckdb-probe-service - in-cluster DuckDB HTTP probe for the advisor loop
# =============================================================================
# Runs next to MinIO in italo-unb so the advisor's data-probing sends small
# SQL strings over the tunnel and gets small JSON results back, instead of
# streaming Delta/Parquet data through a local DuckDB over SSH. Client:
# advisor_loop/probes/remote_probe.py (RemoteDuckDBProbe). Server source:
# service/duckdb_probe_server.py. Image built from service/Dockerfile, pushed
# to GHCR (ghcr.io/italovinicius18/advisor-duckdb-probe).
#
# Deploy:  kubectl apply -f kubernetes/duckdb-probe-service.yaml
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckdb-probe
  namespace: italo-unb
  labels:
    app: duckdb-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: duckdb-probe
  template:
    metadata:
      labels:
        app: duckdb-probe
    spec:
      # No serviceAccountName: this pod never calls the k8s API, so it runs
      # under the namespace's default SA - no ns-admin needed. Explicitly
      # disable token automount too: even the default SA's token is a
      # target not worth mounting into a pod that only talks to MinIO.
      automountServiceAccountToken: false
      # GHCR package is private -> pull via the namespace secret ghcr-pull
      # (same secret the controller uses; ghcr.io-only dockerconfigjson).
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
      - name: duckdb-probe
        image: ghcr.io/italovinicius18/advisor-duckdb-probe:sf100
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - {name: MINIO_ENDPOINT, value: "minio.italo-unb:9000"}
        - {name: MINIO_KEY,      value: "minioadmin"}
        - {name: MINIO_SECRET,   value: "minioadmin"}
        - {name: PORT,           value: "8000"}
        - {name: QUERY_TIMEOUT_S, value: "30"}
        resources:
          requests: {cpu: "1",  memory: "2Gi"}
          limits:   {cpu: "2",  memory: "4Gi"}
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: duckdb-probe
  namespace: italo-unb
  labels:
    app: duckdb-probe
spec:
  type: ClusterIP
  selector:
    app: duckdb-probe
  ports:
  - port: 8000
    targetPort: 8000
