# =============================================================================
# duckdb-probe-service - in-cluster DuckDB HTTP probe for the advisor loop
# =============================================================================
# Runs next to MinIO in italo-unb so the advisor's data-probing sends small
# SQL strings over the tunnel and gets small JSON results back, instead of
# streaming Delta/Parquet data through a local DuckDB over SSH. Client:
# advisor_loop/probes/remote_probe.py (RemoteDuckDBProbe). Server source:
# service/duckdb_probe_server.py. Image built from service/Dockerfile.
#
# Deploy:  kubectl apply -f kubernetes/duckdb-probe-service.yaml
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckdb-probe
  namespace: italo-unb
  labels:
    app: duckdb-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: duckdb-probe
  template:
    metadata:
      labels:
        app: duckdb-probe
    spec:
      serviceAccountName: ns-admin
      containers:
      - name: duckdb-probe
        image: ttl.sh/advisor-duckdb-probe:PLACEHOLDER   # controller substitutes the real tag
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - {name: MINIO_ENDPOINT, value: "minio.italo-unb.svc.cluster.local:9000"}
        - {name: MINIO_KEY,      value: "minioadmin"}
        - {name: MINIO_SECRET,   value: "minioadmin"}
        - {name: PORT,           value: "8000"}
        - {name: QUERY_TIMEOUT_S, value: "30"}
        resources:
          requests: {cpu: "1",  memory: "2Gi"}
          limits:   {cpu: "2",  memory: "4Gi"}
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: duckdb-probe
  namespace: italo-unb
  labels:
    app: duckdb-probe
spec:
  type: ClusterIP
  selector:
    app: duckdb-probe
  ports:
  - port: 8000
    targetPort: 8000
