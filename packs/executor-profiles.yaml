# Perfis de executor disponiveis no cluster (config publica; NAO contem resultados medidos).
# O advisor escolhe um perfil + numero de workers + knobs; desempenho e held-out.
executor_profiles:
  available:
    - {cores: 2, memory_gb: 7, label: xsmall}
    - {cores: 4, memory_gb: 14, label: small}
    - {cores: 8, memory_gb: 28, label: medium}
    - {cores: 12, memory_gb: 48, label: large}
    - {cores: 24, memory_gb: 96, label: xlarge}
  worker_counts: "tipicamente entre 2 e 12 executors"
  driver_memory_gb: "8 e suficiente para SF pequeno/medio"
  note: "escolha um par (cores, memory_gb) desta lista; memory_gb acompanha cores no perfil"
