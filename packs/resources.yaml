# Pack de recursos do cluster para o modo de proposta livre (sem oracle de matriz).
# Conteudo publico (capacidade do cluster) - NAO contem resultados medidos nem
# vieses de desempenho. As faixas de knobs vivem em knob-ranges.yaml; os caps
# fisicos (Guardian) vivem em cluster-rnp.yaml.
loop:
  instrucoes: >
    Proponha a melhor configuracao INICIAL para a carga descrita. Voce esta em
    um loop: apos a execucao real, voce recebera metricas (tempo, status por
    query, shuffle/spill/gc) e podera refinar a configuracao na proxima rodada.
    Nao existe um oraculo de resultados medidos disponivel - decida com base na
    descricao da carga, no plano/telemetria, nos recursos do cluster e no seu
    raciocinio sobre Spark. Voce tem LIBERDADE total para escolher qualquer
    valor dentro das faixas (knob_ranges); nao ha perfis pre-definidos.
    Justifique brevemente a escolha (rationale conciso).

# Nao usar a chave 'cluster' aqui (Guardian le cluster-rnp.yaml). Este bloco e so
# descricao textual da capacidade, para o raciocinio do advisor.
cluster_resources:
  nodes: "10 nos Ready: 3x48 cores/187Gi, 1x24 cores/172Gi, 6x8 cores/15Gi (control-plane/edge)"
  total_cores: 200
  total_memory_gb: 843
  storage: "MinIO (S3-compativel) com tabelas Delta Lake; Spark sobre Kubernetes (spark-submit, k8s:// master)"
  namespace_scoped: true

engine: spark-3.5
